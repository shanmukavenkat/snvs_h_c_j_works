<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card JSON</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1e1e1e] flex items-center justify-center min-h-screen">

<div class="bg-[#2d2d2d] rounded-xl shadow-2xl w-[380px] text-white font-mono">
    <!-- Header -->
    <div class="bg-[#1f1f1f] flex items-center justify-between px-4 py-2 border-b border-gray-600 rounded-t-xl">
        <div class="flex gap-2">
            <span class="w-3 h-3 bg-red-500 rounded-full"></span>
            <span class="w-3 h-3 bg-yellow-400 rounded-full"></span>
            <span class="w-3 h-3 bg-green-500 rounded-full"></span>
        </div>
        <div class="text-sm text-gray-300 font-semibold">Business Card.json</div>
        <div></div>
    </div>

    <!-- JSON Content -->
    <div class="px-5 py-4 text-sm whitespace-pre leading-relaxed">
        <code>
            <span class="text-[#ce9178]">{"name"</span>: <span class="text-[#dcdcaa]">"@snvs_komal"</span>,<br>
            <span class="text-[#ce9178]">"title"</span>: <span class="text-[#dcdcaa]">"snvskomal"</span>,<br>
            <span class="text-[#ce9178]">"email"</span>: <span class="text-[#dcdcaa]">"my@email.com"</span>,<br>
            <span class="text-[#ce9178]">"link"</span>: <span class="text-[#dcdcaa]">"securitybreak.io"</span>
            <span class="text-[#ce9178]">}</span>
        </code>
    </div>
</div>

<script>
    const data = {
        name: "@fr0gger_",
        title: "Malware Therapist",
        email: "my@email.com",
        link: "securitybreak.io"
    };

    const content = Object.entries(data).map(
        ([k, v], i, arr) =>
            `<span class='text-[#ce9178]'>"${k}"</span>: <span class='text-[#dcdcaa]'>"${v}"</span>${i < arr.length - 1 ? ',' : ''}`
    ).join('<br>');

    document.querySelector('code').innerHTML = `<span class='text-[#ce9178]'>\{</span><br>${content}<br><span class='text-[#ce9178]'>\}</span>`;
</script>

</body>
</html>

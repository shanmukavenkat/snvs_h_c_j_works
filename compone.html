<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Styling</title>

    <style>
        .card-1 {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Add shadow for better aesthetics */
            width: 150px; /* Increased width for better readability */
            background-color: #77b7ff; /* Light blue background */
            border: 2px solid #92400e; /* Added border with color and thickness */
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column; /* Stack items vertically */
            align-items: center; /* Center content inside the card */
        }

        .card {
            margin: 0; /* Remove any default margin from <p> */
        }
    </style>
</head>
<body>
<ul>
    <li class="card-1">
        <p class="card">Name</p>
        <p class="card">Komal</p>
    </li>
</ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meta</title>
    <meta name="viewport" content="width=device-width initial-scale=1.0">
</head>
<body>
<h1>All Tags</h1>
<h2>Heading Tags</h2>

<div style="background-color: #c1e8ea; padding:20px;">
<p> the  abbr  tag which is the abbreviation tag</p>
<p>My Name  <abbr title="World Health Organization">S N V S KOMAL</abbr> I loved to a web developer </p>
<br/>
</div>

<!--the abbar tag and the acronym tag are used to define an abbreviation or an acronym-->

<div style="background-color: blanchedalmond">
    <p><b>the address tag</b></p>
    <address>
        <p>i am your  <a href="https://shanmukavenkat.github.io/A.S.N.V.S..KOMAL/">SNVSKOMAL </a></p>
        <br>
        <p>Visit us at: Guntur</p>
        <br>
        <p>Phone: 1234567890</p>
    </address>
</div>

<!--the address tag is used to define the contact information of the author or owner of a document or an article-->

<div style="background-color: #77b7ff">
    <p><b>the area tag</b></p>
    <p>the area tag is used to define an area inside an image map</p>
    <img src="https://www.tutorialrepublic.com/lib/images/javascript-illustration.png" usemap="#image-map" alt="Example Image">

    <map name="image-map">
        <!-- Rectangular clickable area -->
        <area shape="rect"  style="background-color: #0b0b0b" coords="50,50,200,200" href="https://plus.unsplash.com/premium_photo-1739844476608-6d4e22c38b68?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw5fHx8ZW58MHx8fHx8" alt="Rectangle Area" target="_blank">

        <!-- Circular clickable area -->
        <area shape="circle" style="background-color: #0b0b0b; opacity:89 ;"  coords="300,150,50" href="https://images.unsplash.com/photo-1738762388560-4d77edf03049?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNnx8fGVufDB8fHx8fA%3D%3D" alt="Circle Area" target="_blank">
    </map>

</div>

<!--the area tag is used to define an area inside an image map-->



<div style="position: relative; display: inline-block;">
    <!-- Image with Image Map -->
    <img src="https://www.tutorialrepublic.com/lib/images/javascript-illustration.png" usemap="#image-map" alt="Example Image">

    <!-- SVG Overlay -->
    <svg width="100%" height="100%" viewBox="0 0 600 400" style="position: absolute; top: 0; left: 0; pointer-events: none;">
        <!-- Rectangle -->
        <a href="https://plus.unsplash.com/premium_photo-1739844476608-6d4e22c38b68?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw5fHx8ZW58MHx8fHx8" target="_blank">
            <rect x="50" y="50" width="150" height="150" fill="rgba(255, 0, 0, 0.5)" stroke="red" stroke-width="2" />
        </a>

        <!-- Circle -->
        <a href="https://images.unsplash.com/photo-1738762388560-4d77edf03049?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNnx8fGVufDB8fHx8fA%3D%3D" target="_blank">
            <circle cx="300" cy="150" r="50" fill="rgba(0, 0, 255, 0.5)" stroke="blue" stroke-width="2" />
        </a>
    </svg>
</div>














</body>
</html>
